/* =====================================================================
   HireFlow Design System - Variables & Theme Tokens
   Meets WCAG AA Contrast (4.5:1 min) in both Light & Dark modes
===================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

:root {
  /* Fonts */
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Type Scale */
  --font-size-xs: 0.75rem;    /* 12px */
  --font-size-sm: 0.875rem;   /* 14px */
  --font-size-base: 1rem;     /* 16px */
  --font-size-md: 1.125rem;   /* 18px */
  --font-size-lg: 1.25rem;    /* 20px */
  --font-size-xl: 1.5rem;     /* 24px */
  --font-size-2xl: 2rem;      /* 32px */
  --font-size-3xl: 2.75rem;   /* 44px */

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-base: 1.5;
  --leading-relaxed: 1.625;

  /* Spacing Scale (4, 8, 12, 16, 24, 32, 48, 64) */
  --space-1: 0.25rem;  /* 4px */
  --space-2: 0.5rem;   /* 8px */
  --space-3: 0.75rem;  /* 12px */
  --space-4: 1rem;     /* 16px */
  --space-6: 1.5rem;   /* 24px */
  --space-8: 2rem;     /* 32px */
  --space-12: 3rem;    /* 48px */
  --space-16: 4rem;    /* 64px */

  /* Border Radii (6, 10, 16, 999) */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows (Soft, low opacity) */
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);

  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);

  /* Stage Colors */
  --stage-applied: #64748b;
  --stage-applied-bg: rgba(100, 116, 139, 0.12);
  --stage-screening: #0284c7;
  --stage-screening-bg: rgba(2, 132, 199, 0.12);
  --stage-interview: #7c3aed;
  --stage-interview-bg: rgba(124, 58, 237, 0.12);
  --stage-selected: #16a34a;
  --stage-selected-bg: rgba(22, 163, 74, 0.12);
  --stage-offered: #d97706;
  --stage-offered-bg: rgba(217, 119, 6, 0.12);
  --stage-rejected: #dc2626;
  --stage-rejected-bg: rgba(220, 38, 38, 0.12);
  --stage-withdrawn: #94a3b8;
  --stage-withdrawn-bg: rgba(148, 163, 184, 0.12);

  /* Light Theme (Default) */
  --bg: #f6f8fb;
  --surface: #ffffff;
  --surface-2: #f0f3f9;
  --surface-hover: #e8ecf4;
  --border: #e3e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #5b6b82;
  --text-subtle: #8a99ad;

  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-active: #3730a3;
  --primary-soft: #eef0ff;
  --primary-contrast: #ffffff;

  --navy: #0b1b3a;
  --navy-surface: #13274e;
  --navy-border: #1e3a70;
  --navy-text: #f8fafc;
  --navy-muted: #94a3b8;

  --success: #16a34a;
  --success-soft: #ecfdf5;
  --success-text: #14532d;

  --warning: #d97706;
  --warning-soft: #fffbeb;
  --warning-text: #78350f;

  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --danger-text: #7f1d1d;

  --info: #0284c7;
  --info-soft: #f0f9ff;
  --info-text: #0c4a6e;

  /* Focus ring */
  --focus-ring: 0 0 0 3px rgba(79, 70, 229, 0.35);
}

/* Dark Theme Override */
[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #111a2e;
  --surface-2: #17223b;
  --surface-hover: #1f2e4d;
  --border: #24314d;
  --border-strong: #334466;
  --text: #e6ecf7;
  --text-muted: #93a3bd;
  --text-subtle: #677b99;

  --primary: #818cf8;
  --primary-hover: #6366f1;
  --primary-active: #4f46e5;
  --primary-soft: #1e1b4b;
  --primary-contrast: #ffffff;

  --navy: #070d18;
  --navy-surface: #0e1726;
  --navy-border: #1a2638;
  --navy-text: #e6ecf7;
  --navy-muted: #8494ab;

  --success: #22c55e;
  --success-soft: rgba(34, 197, 94, 0.15);
  --success-text: #86efac;

  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.15);
  --warning-text: #fde68a;

  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.15);
  --danger-text: #fca5a5;

  --info: #38bdf8;
  --info-soft: rgba(56, 189, 248, 0.15);
  --info-text: #bae6fd;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);

  --focus-ring: 0 0 0 3px rgba(129, 140, 248, 0.45);
}

/* Reduced Motion Preference */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* =====================================================================
   HireFlow Base Styles - Reset, Typography & Accessibility
===================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-ui);
  font-size: var(--font-size-base);
  line-height: var(--leading-base);
  color: var(--text);
  background-color: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Skip to main content link for keyboard / screen reader users */
.skip-link {
  position: absolute;
  top: -100px;
  left: 1rem;
  background: var(--primary);
  color: #ffffff;
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  z-index: 99999;
  text-decoration: none;
  box-shadow: var(--shadow-lg);
  transition: top var(--transition-fast);
}

.skip-link:focus {
  top: 1rem;
  outline: none;
  box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px var(--primary);
}

/* Headings */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--text);
  line-height: var(--leading-tight);
  font-weight: 700;
  letter-spacing: -0.02em;
}

h1 { font-size: var(--font-size-2xl); }
h2 { font-size: var(--font-size-xl); }
h3 { font-size: var(--font-size-lg); }
h4 { font-size: var(--font-size-md); }
h5 { font-size: var(--font-size-base); }
h6 { font-size: var(--font-size-sm); }

@media (min-width: 768px) {
  h1 { font-size: var(--font-size-3xl); }
  h2 { font-size: var(--font-size-2xl); }
  h3 { font-size: var(--font-size-xl); }
}

p {
  margin-bottom: var(--space-3);
  color: var(--text);
}

p.lead {
  font-size: var(--font-size-md);
  line-height: var(--leading-relaxed);
  color: var(--text-muted);
}

small {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

a {
  color: var(--primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}

a:hover {
  text-decoration: underline;
}

img, svg {
  display: block;
  max-width: 100%;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: none;
}

/* Global Focus Styles for Keyboard Accessibility */
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

/* Screen reader only utility */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Layout helper containers */
.container {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--space-4);
}

@media (min-width: 768px) {
  .container {
    padding: 0 var(--space-6);
  }
}

.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-1 { gap: var(--space-1); }
.gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); }
.gap-4 { gap: var(--space-4); }
.gap-6 { gap: var(--space-6); }

.grid { display: grid; }
.w-full { width: 100%; }
.text-center { text-align: center; }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: var(--font-size-sm); }
.text-xs { font-size: var(--font-size-xs); }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }

/* Demo Mode Banner */
.demo-banner {
  background: var(--navy);
  color: #ffffff;
  padding: var(--space-2) var(--space-4);
  font-size: var(--font-size-xs);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  z-index: 1000;
  border-bottom: 1px solid var(--navy-border);
}

.demo-banner.hidden {
  display: none;
}

.demo-banner-content {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.demo-banner .badge {
  background: var(--primary);
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.demo-banner-close {
  color: #cbd5e1;
  background: transparent;
  border: none;
  padding: 4px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition-fast), color var(--transition-fast);
}

.demo-banner-close:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
}

/* =====================================================================
   HireFlow Components - Shared UI Component Library
===================================================================== */

/* ---------------------------------------------------------------------
   1. Buttons
--------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 0.625rem 1.125rem;
  font-size: var(--font-size-sm);
  font-weight: 600;
  line-height: 1;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
  user-select: none;
  min-height: 40px;
  text-decoration: none;
}

.btn:hover {
  text-decoration: none;
}

.btn:disabled, .btn[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
  pointer-events: none;
}

/* Primary */
.btn-primary {
  background-color: var(--primary);
  color: var(--primary-contrast);
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover {
  background-color: var(--primary-hover);
  box-shadow: var(--shadow-md);
}
.btn-primary:active {
  background-color: var(--primary-active);
}

/* Secondary */
.btn-secondary {
  background-color: var(--surface);
  color: var(--text);
  border-color: var(--border);
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover {
  background-color: var(--surface-2);
  border-color: var(--border-strong);
}

/* Ghost */
.btn-ghost {
  background-color: transparent;
  color: var(--text-muted);
}
.btn-ghost:hover {
  background-color: var(--surface-2);
  color: var(--text);
}

/* Danger */
.btn-danger {
  background-color: var(--danger);
  color: #ffffff;
}
.btn-danger:hover {
  background-color: #b91c1c;
}

/* Danger Ghost */
.btn-danger-ghost {
  background-color: transparent;
  color: var(--danger);
}
.btn-danger-ghost:hover {
  background-color: var(--danger-soft);
}

/* Success */
.btn-success {
  background-color: var(--success);
  color: #ffffff;
}
.btn-success:hover {
  background-color: #15803d;
}

/* Sizes */
.btn-sm {
  padding: 0.375rem 0.75rem;
  font-size: var(--font-size-xs);
  min-height: 32px;
  border-radius: var(--radius-sm);
}

.btn-lg {
  padding: 0.875rem 1.5rem;
  font-size: var(--font-size-base);
  min-height: 48px;
  border-radius: var(--radius-md);
}

/* Icon-only */
.btn-icon {
  padding: 0;
  width: 38px;
  height: 38px;
  min-height: 38px;
  border-radius: var(--radius-md);
}
.btn-icon.btn-sm {
  width: 32px;
  height: 32px;
  min-height: 32px;
}

/* Button Loading State */
.btn.is-loading {
  position: relative;
  color: transparent !important;
  pointer-events: none;
}
.btn.is-loading::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  top: calc(50% - 9px);
  left: calc(50% - 9px);
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: btn-spin 0.7s linear infinite;
  color: inherit;
}
.btn-primary.is-loading::after {
  border-color: #ffffff;
  border-right-color: transparent;
}
@keyframes btn-spin {
  to { transform: rotate(360deg); }
}

/* ---------------------------------------------------------------------
   2. Form Controls
--------------------------------------------------------------------- */
.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-bottom: var(--space-4);
  position: relative;
}

.form-label {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.form-label .required-indicator {
  color: var(--danger);
  margin-left: 2px;
}

.form-hint {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

.form-error {
  font-size: var(--font-size-xs);
  color: var(--danger);
  display: none;
  align-items: center;
  gap: 4px;
}

.form-group.has-error .form-error {
  display: flex;
}

.form-group.has-error .form-control,
.form-group.has-error .form-select {
  border-color: var(--danger);
}

.form-control, .form-select {
  width: 100%;
  padding: 0.625rem 0.875rem;
  font-size: var(--font-size-sm);
  color: var(--text);
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  min-height: 42px;
}

.form-control:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: var(--focus-ring);
}

.form-control::placeholder {
  color: var(--text-subtle);
}

.form-control:disabled, .form-select:disabled {
  background-color: var(--surface-2);
  cursor: not-allowed;
  opacity: 0.7;
}

textarea.form-control {
  min-height: 96px;
  resize: vertical;
}

.char-counter {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  text-align: right;
  margin-top: 2px;
}

/* Password Input Wrapper with Show/Hide */
.input-with-action {
  position: relative;
  display: flex;
  align-items: center;
}
.input-with-action .form-control {
  padding-right: 44px;
}
.input-with-action .btn-action {
  position: absolute;
  right: 6px;
  height: 30px;
  width: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
}
.input-with-action .btn-action:hover {
  color: var(--text);
  background: var(--surface-2);
}

/* Checkbox and Radio */
.form-check {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  cursor: pointer;
  margin-bottom: var(--space-3);
  user-select: none;
}

.form-check-input {
  width: 18px;
  height: 18px;
  margin-top: 2px;
  accent-color: var(--primary);
  cursor: pointer;
}

.form-check-label {
  font-size: var(--font-size-sm);
  color: var(--text);
}

/* File Dropzone */
.file-dropzone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-6) var(--space-4);
  text-align: center;
  background-color: var(--surface-2);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.file-dropzone:hover, .file-dropzone.dragover {
  border-color: var(--primary);
  background-color: var(--primary-soft);
}

.file-dropzone input[type="file"] {
  display: none;
}

.file-dropzone-icon {
  margin: 0 auto var(--space-2);
  color: var(--primary);
}

.file-meta-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: var(--radius-md);
  font-size: var(--font-size-xs);
  margin-top: var(--space-2);
}

/* Tag / Skill Input */
.tag-input-container {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  min-height: 42px;
  align-items: center;
}

.tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: var(--font-size-xs);
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
}

.tag-badge-remove {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}

.tag-badge-remove:hover {
  opacity: 0.7;
}

.tag-input-container input {
  border: none;
  outline: none;
  background: transparent;
  flex: 1;
  min-width: 120px;
  font-size: var(--font-size-sm);
  color: var(--text);
}

/* ---------------------------------------------------------------------
   3. Cards & KPI Stat Cards
--------------------------------------------------------------------- */
.card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-fast), border-color var(--transition-fast);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
  gap: var(--space-3);
}

.card-title {
  font-size: var(--font-size-md);
  font-weight: 700;
  margin: 0;
}

.kpi-card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.kpi-label {
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.kpi-value-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
}

.kpi-value {
  font-size: var(--font-size-2xl);
  font-weight: 800;
  font-family: var(--font-heading);
  color: var(--text);
  line-height: 1;
}

.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: var(--font-size-xs);
  font-weight: 600;
}

.kpi-trend.positive { color: var(--success); }
.kpi-trend.negative { color: var(--danger); }
.kpi-trend.neutral { color: var(--text-muted); }

/* ---------------------------------------------------------------------
   4. Badges, Pills & Avatars
--------------------------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0.25rem 0.625rem;
  font-size: var(--font-size-xs);
  font-weight: 600;
  border-radius: var(--radius-full);
  line-height: 1.2;
  white-space: nowrap;
}

.badge-default {
  background: var(--surface-2);
  color: var(--text-muted);
  border: 1px solid var(--border);
}

.badge-primary {
  background: var(--primary-soft);
  color: var(--primary);
}

.badge-success {
  background: var(--success-soft);
  color: var(--success-text);
}

.badge-warning {
  background: var(--warning-soft);
  color: var(--warning-text);
}

.badge-danger {
  background: var(--danger-soft);
  color: var(--danger-text);
}

.badge-info {
  background: var(--info-soft);
  color: var(--info-text);
}

/* Stage Specific Badges */
.badge-stage-applied {
  background: var(--stage-applied-bg);
  color: var(--stage-applied);
}
.badge-stage-screening {
  background: var(--stage-screening-bg);
  color: var(--stage-screening);
}
.badge-stage-interview {
  background: var(--stage-interview-bg);
  color: var(--stage-interview);
}
.badge-stage-selected {
  background: var(--stage-selected-bg);
  color: var(--stage-selected);
}
.badge-stage-offered {
  background: var(--stage-offered-bg);
  color: var(--stage-offered);
}
.badge-stage-rejected {
  background: var(--stage-rejected-bg);
  color: var(--stage-rejected);
}
.badge-stage-withdrawn {
  background: var(--stage-withdrawn-bg);
  color: var(--stage-withdrawn);
}

/* Avatars with Initials */
.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  font-weight: 700;
  color: #ffffff;
  user-select: none;
  flex-shrink: 0;
  text-transform: uppercase;
}

.avatar-xs { width: 24px; height: 24px; font-size: 10px; }
.avatar-sm { width: 32px; height: 32px; font-size: 12px; }
.avatar-md { width: 40px; height: 40px; font-size: 14px; }
.avatar-lg { width: 56px; height: 56px; font-size: 18px; }
.avatar-xl { width: 80px; height: 80px; font-size: 24px; }

/* ---------------------------------------------------------------------
   5. Tabs & Accordion
--------------------------------------------------------------------- */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  gap: var(--space-4);
  margin-bottom: var(--space-6);
  overflow-x: auto;
}

.tab-btn {
  padding: var(--space-3) var(--space-2);
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition-fast);
}

.tab-btn:hover {
  color: var(--text);
}

.tab-btn.active, .tab-btn[aria-selected="true"] {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.tab-panel {
  display: none;
}
.tab-panel.active {
  display: block;
}

/* Accordion */
.accordion {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.accordion-item {
  border-bottom: 1px solid var(--border);
}
.accordion-item:last-child {
  border-bottom: none;
}

.accordion-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-4);
  background: var(--surface);
  font-weight: 600;
  color: var(--text);
  text-align: left;
}

.accordion-header:hover {
  background: var(--surface-2);
}

.accordion-content {
  display: none;
  padding: var(--space-4);
  background: var(--surface);
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: var(--font-size-sm);
}

.accordion-item.open .accordion-content {
  display: block;
}

/* ---------------------------------------------------------------------
   6. Data Table
--------------------------------------------------------------------- */
.table-container {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: var(--font-size-sm);
}

.table th, .table td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
}

.table th {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  user-select: none;
}

.table th.sortable {
  cursor: pointer;
}
.table th.sortable:hover {
  color: var(--text);
}

.table tr:last-child td {
  border-bottom: none;
}

.table tbody tr:hover {
  background-color: var(--surface-hover);
}

/* Responsive Table Under 768px: Card Mode */
@media (max-width: 767px) {
  .table-responsive-stack table,
  .table-responsive-stack thead,
  .table-responsive-stack tbody,
  .table-responsive-stack th,
  .table-responsive-stack td,
  .table-responsive-stack tr {
    display: block;
  }
  .table-responsive-stack thead tr {
    position: absolute;
    top: -9999px;
    left: -9999px;
  }
  .table-responsive-stack tr {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-4);
    background: var(--surface);
    padding: var(--space-3);
  }
  .table-responsive-stack td {
    border: none;
    padding: var(--space-2) 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: right;
  }
  .table-responsive-stack td::before {
    content: attr(data-label);
    font-weight: 600;
    color: var(--text-muted);
    text-align: left;
    padding-right: var(--space-3);
  }
}

/* ---------------------------------------------------------------------
   7. Modals & Side Drawers
--------------------------------------------------------------------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transition-normal), visibility var(--transition-normal);
  padding: var(--space-4);
}

.modal-backdrop.is-open {
  opacity: 1;
  visibility: visible;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: translateY(20px) scale(0.97);
  transition: transform var(--transition-normal);
  overflow: hidden;
}

.modal-backdrop.is-open .modal {
  transform: translateY(0) scale(1);
}

.modal-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: var(--font-size-md);
  font-weight: 700;
  margin: 0;
}

.modal-body {
  padding: var(--space-6);
  overflow-y: auto;
}

.modal-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-3);
  background: var(--surface-2);
}

/* Side Drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(2px);
  z-index: 9998;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transition-normal), visibility var(--transition-normal);
}

.drawer-backdrop.is-open {
  opacity: 1;
  visibility: visible;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  max-width: 540px;
  background: var(--surface);
  box-shadow: var(--shadow-xl);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform var(--transition-normal);
  border-left: 1px solid var(--border);
}

.drawer-backdrop.is-open + .drawer,
.drawer.is-open {
  transform: translateX(0);
}

.drawer-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.drawer-body {
  padding: var(--space-6);
  overflow-y: auto;
  flex: 1;
}

.drawer-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-3);
  background: var(--surface-2);
}

/* ---------------------------------------------------------------------
   8. Toast Notifications
--------------------------------------------------------------------- */
.toast-container {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 100000;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
  max-width: 380px;
  width: 100%;
}

.toast {
  pointer-events: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  font-size: var(--font-size-sm);
  animation: toast-in 0.25s ease-out;
  transition: opacity var(--transition-normal), transform var(--transition-normal);
}

.toast.toast-success { border-left: 4px solid var(--success); }
.toast.toast-error { border-left: 4px solid var(--danger); }
.toast.toast-info { border-left: 4px solid var(--info); }
.toast.toast-warning { border-left: 4px solid var(--warning); }

.toast-message {
  flex: 1;
  color: var(--text);
  line-height: 1.4;
}

.toast-close {
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
}
.toast-close:hover {
  color: var(--text);
}

@keyframes toast-in {
  from {
    transform: translateY(12px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* ---------------------------------------------------------------------
   9. Timeline & Stepper
--------------------------------------------------------------------- */
.timeline {
  position: relative;
  padding-left: var(--space-6);
}

.timeline::before {
  content: "";
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 9px;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  margin-bottom: var(--space-6);
}

.timeline-item:last-child {
  margin-bottom: 0;
}

.timeline-point {
  position: absolute;
  left: -24px;
  top: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--primary);
}

.timeline-title {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.timeline-meta {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

/* Horizontal Stage Stepper for Application Cards */
.stage-stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  margin: var(--space-4) 0;
  padding: 0 var(--space-2);
}

.stage-stepper::before {
  content: "";
  position: absolute;
  top: 12px;
  left: 20px;
  right: 20px;
  height: 2px;
  background: var(--border);
  z-index: 1;
}

.step-node {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.step-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
}

.step-node.completed .step-dot {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
}

.step-node.current .step-dot {
  background: var(--surface);
  border-color: var(--primary);
  color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

.step-node.rejected .step-dot {
  background: var(--danger);
  border-color: var(--danger);
  color: #ffffff;
}

.step-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

.step-node.current .step-label {
  color: var(--primary);
  font-weight: 700;
}

/* ---------------------------------------------------------------------
   10. Skeleton Loaders, Empty States, Error States
--------------------------------------------------------------------- */
.skeleton {
  background: linear-gradient(
    90deg,
    var(--surface-2) 25%,
    var(--surface-hover) 37%,
    var(--surface-2) 63%
  );
  background-size: 400% 100%;
  animation: skeleton-pulse 1.4s ease infinite;
  border-radius: var(--radius-sm);
}

@keyframes skeleton-pulse {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

.empty-state {
  padding: var(--space-12) var(--space-4);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
}

.empty-state-icon {
  width: 64px;
  height: 64px;
  color: var(--text-subtle);
  margin-bottom: var(--space-2);
}

.empty-state-title {
  font-size: var(--font-size-lg);
  font-weight: 700;
  color: var(--text);
}

.empty-state-text {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
  max-width: 420px;
  margin: 0 auto;
}

.error-state {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  background: var(--danger-soft);
  border: 1px solid rgba(220, 38, 38, 0.2);
  border-radius: var(--radius-lg);
  margin: var(--space-4) 0;
}

.error-state-title {
  color: var(--danger);
  font-weight: 700;
  margin-bottom: var(--space-2);
}

/* ---------------------------------------------------------------------
   11. Pagination, Breadcrumbs, Dropdown Menu & Tooltips
--------------------------------------------------------------------- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  margin-top: var(--space-6);
}

.page-btn {
  min-width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.page-btn:hover {
  background: var(--surface-2);
}

.page-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  margin-bottom: var(--space-3);
}

.breadcrumbs a {
  color: var(--text-muted);
}
.breadcrumbs a:hover {
  color: var(--primary);
}
.breadcrumbs-sep {
  color: var(--text-subtle);
}

/* Dropdown Menu */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  min-width: 180px;
  padding: 4px;
  z-index: 1000;
  display: none;
}

.dropdown.is-open .dropdown-menu {
  display: block;
}

.dropdown-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0.5rem 0.75rem;
  font-size: var(--font-size-sm);
  color: var(--text);
  border-radius: var(--radius-sm);
  cursor: pointer;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  transition: background var(--transition-fast);
}

.dropdown-item:hover {
  background: var(--surface-2);
  text-decoration: none;
}

.dropdown-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* =====================================================================
   HireFlow Layout - Public Navbar, Dashboard Layout, Sidebar & Topbar
===================================================================== */

/* ---------------------------------------------------------------------
   1. Public Navigation Bar
--------------------------------------------------------------------- */
.navbar-public {
  background-color: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 900;
  height: 70px;
  display: flex;
  align-items: center;
}

.navbar-public .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-link {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-heading);
  font-size: var(--font-size-lg);
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  letter-spacing: -0.02em;
}

.brand-link:hover {
  text-decoration: none;
}

.brand-link svg {
  width: 32px;
  height: 32px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: var(--space-6);
  list-style: none;
}

.nav-links a {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-muted);
  text-decoration: none;
  transition: color var(--transition-fast);
}

.nav-links a:hover, .nav-links a.active {
  color: var(--primary);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

/* ---------------------------------------------------------------------
   2. Dashboard Layout (HR / Candidate / Admin)
--------------------------------------------------------------------- */
.app-layout {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background-color: var(--bg);
}

/* Left Sidebar */
.app-sidebar {
  width: 260px;
  background-color: var(--navy);
  color: var(--navy-text);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  transition: transform var(--transition-normal);
  z-index: 1000;
  border-right: 1px solid var(--navy-border);
}

.sidebar-header {
  height: 70px;
  padding: 0 var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--navy-border);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-heading);
  font-size: var(--font-size-lg);
  font-weight: 800;
  color: #ffffff;
  text-decoration: none;
}

.sidebar-brand:hover {
  text-decoration: none;
}

.sidebar-nav {
  flex: 1;
  padding: var(--space-4) var(--space-3);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.sidebar-section-title {
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--navy-muted);
  padding: var(--space-3) var(--space-3) var(--space-1);
  letter-spacing: 0.05em;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0.625rem 0.875rem;
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--navy-muted);
  text-decoration: none;
  transition: all var(--transition-fast);
}

.sidebar-link svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.sidebar-link:hover {
  color: #ffffff;
  background-color: var(--navy-surface);
  text-decoration: none;
}

.sidebar-link.active {
  color: #ffffff;
  background-color: var(--primary);
  font-weight: 600;
}

.sidebar-link .badge-counter {
  margin-left: auto;
  background: var(--navy-surface);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.sidebar-footer {
  padding: var(--space-4);
  border-top: 1px solid var(--navy-border);
}

/* User mini profile in sidebar */
.sidebar-user {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2);
  border-radius: var(--radius-md);
}

.sidebar-user-info {
  flex: 1;
  min-width: 0;
}

.sidebar-user-name {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-user-role {
  font-size: var(--font-size-xs);
  color: var(--navy-muted);
  text-transform: capitalize;
}

/* ---------------------------------------------------------------------
   3. Main App Container & Top Bar
--------------------------------------------------------------------- */
.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.app-topbar {
  height: 70px;
  background-color: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  position: sticky;
  top: 0;
  z-index: 800;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.sidebar-toggle-btn {
  display: none; /* Desktop default */
  padding: 6px;
  border-radius: var(--radius-sm);
  color: var(--text);
}

.sidebar-toggle-btn:hover {
  background: var(--surface-2);
}

/* Topbar Notification Bell */
.notification-bell-btn {
  position: relative;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  transition: all var(--transition-fast);
}

.notification-bell-btn:hover {
  color: var(--text);
  background: var(--surface-2);
}

.notification-badge-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--danger);
  border: 2px solid var(--surface);
}

/* App Content Area */
.app-content {
  flex: 1;
  padding: var(--space-6);
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

.page-header {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
}

@media (min-width: 768px) {
  .page-header {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}

.page-title {
  margin: 0;
}

.page-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

/* ---------------------------------------------------------------------
   4. Responsive Breakpoints
--------------------------------------------------------------------- */
/* Mobile & Tablet under 1024px: Sidebar becomes Drawer */
@media (max-width: 1023px) {
  .sidebar-toggle-btn {
    display: flex;
  }

  .app-sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    box-shadow: var(--shadow-xl);
  }

  .app-sidebar.is-open {
    transform: translateX(0);
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--transition-normal), visibility var(--transition-normal);
  }

  .sidebar-backdrop.is-open {
    opacity: 1;
    visibility: visible;
  }
}

@media (max-width: 767px) {
  .app-content {
    padding: var(--space-4);
  }
  .app-topbar {
    padding: 0 var(--space-4);
  }
  .nav-links {
    display: none; /* Simplified public nav for small screens */
  }
}

/* =====================================================================
   HireFlow Page-Specific Styles
===================================================================== */

/* ---------------------------------------------------------------------
   1. Public Landing & Job Board (index.html, job-details.html)
--------------------------------------------------------------------- */
.hero-section {
  background: linear-gradient(135deg, var(--navy) 0%, #172a54 100%);
  color: #ffffff;
  padding: var(--space-16) 0 var(--space-12);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero-headline {
  font-size: var(--font-size-3xl);
  font-weight: 800;
  color: #ffffff;
  margin-bottom: var(--space-4);
  line-height: 1.15;
}

.hero-subhead {
  font-size: var(--font-size-md);
  color: var(--navy-muted);
  max-width: 680px;
  margin: 0 auto var(--space-8);
}

.hero-search-box {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: var(--space-2);
  box-shadow: var(--shadow-xl);
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

@media (min-width: 768px) {
  .hero-search-box {
    flex-direction: row;
    align-items: center;
    padding: var(--space-3);
  }
}

.search-field-group {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1;
  padding: 0 var(--space-2);
}

.search-field-group svg {
  color: var(--text-muted);
  flex-shrink: 0;
}

.search-field-group input {
  border: none;
  outline: none;
  width: 100%;
  font-size: var(--font-size-base);
  color: var(--text);
  background: transparent;
}

.search-divider {
  width: 1px;
  height: 32px;
  background: var(--border);
  display: none;
}

@media (min-width: 768px) {
  .search-divider {
    display: block;
  }
}

/* Stats Strip */
.stats-strip {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: var(--space-8) 0;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-6);
  text-align: center;
}

@media (min-width: 768px) {
  .stats-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.stat-item-number {
  font-size: var(--font-size-2xl);
  font-weight: 800;
  font-family: var(--font-heading);
  color: var(--primary);
  margin-bottom: 4px;
}

.stat-item-label {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
  font-weight: 500;
}

/* Job Directory Layout */
.jobs-page-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-8);
  margin: var(--space-8) 0;
}

@media (min-width: 1024px) {
  .jobs-page-layout {
    grid-template-columns: 280px 1fr;
  }
}

.filter-sidebar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  height: fit-content;
}

.job-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  transition: all var(--transition-fast);
  cursor: pointer;
  text-decoration: none;
}

.job-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  text-decoration: none;
}

.job-card-title {
  font-size: var(--font-size-lg);
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.job-card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

.job-card-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.job-card-salary {
  font-weight: 700;
  color: var(--success);
  font-size: var(--font-size-sm);
}

/* Job Details Page */
.job-detail-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-8);
  margin: var(--space-8) 0;
}

@media (min-width: 1024px) {
  .job-detail-grid {
    grid-template-columns: 1fr 380px;
  }
}

.apply-card {
  position: sticky;
  top: 90px;
}

/* ---------------------------------------------------------------------
   2. Auth Pages (login.html, register.html)
--------------------------------------------------------------------- */
.auth-page {
  min-height: 100vh;
  display: flex;
  background-color: var(--surface);
}

.auth-panel-form {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-8) var(--space-6);
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.auth-panel-brand {
  flex: 1;
  background: linear-gradient(135deg, var(--navy) 0%, #172a54 100%);
  color: #ffffff;
  padding: var(--space-12);
  display: none;
  flex-direction: column;
  justify-content: space-between;
}

@media (min-width: 1024px) {
  .auth-panel-brand {
    display: flex;
  }
}

/* Demo account quick login chips */
.demo-accounts-card {
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin-top: var(--space-6);
}

.demo-chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-2);
}

.demo-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.demo-chip:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

/* Password live strength meter */
.password-strength-meter {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

.password-strength-bar {
  height: 100%;
  width: 0;
  transition: width 0.3s ease, background-color 0.3s ease;
}

.password-strength-bar.weak { width: 33%; background: var(--danger); }
.password-strength-bar.medium { width: 66%; background: var(--warning); }
.password-strength-bar.strong { width: 100%; background: var(--success); }

.caps-warning {
  font-size: var(--font-size-xs);
  color: var(--warning);
  display: none;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}

/* ---------------------------------------------------------------------
   3. Pipeline Kanban Board (hr/pipeline.html)
--------------------------------------------------------------------- */
.kanban-board {
  display: flex;
  gap: var(--space-4);
  overflow-x: auto;
  padding-bottom: var(--space-6);
  min-height: calc(100vh - 240px);
  align-items: flex-start;
}

.kanban-column {
  width: 320px;
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 240px);
}

.kanban-column-header {
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid transparent;
}

.kanban-column[data-stage="Applied"] .kanban-column-header { border-bottom-color: var(--stage-applied); }
.kanban-column[data-stage="Screening"] .kanban-column-header { border-bottom-color: var(--stage-screening); }
.kanban-column[data-stage="Interview"] .kanban-column-header { border-bottom-color: var(--stage-interview); }
.kanban-column[data-stage="Selected"] .kanban-column-header { border-bottom-color: var(--stage-selected); }
.kanban-column[data-stage="Offered"] .kanban-column-header { border-bottom-color: var(--stage-offered); }
.kanban-column[data-stage="Rejected"] .kanban-column-header { border-bottom-color: var(--stage-rejected); }

.kanban-column-title {
  font-size: var(--font-size-sm);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--text);
}

.kanban-column-count {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  background: var(--surface);
  color: var(--text-muted);
}

.kanban-card-list {
  padding: var(--space-3);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  flex: 1;
  min-height: 120px;
  transition: background-color var(--transition-fast);
}

.kanban-card-list.drag-over {
  background-color: var(--primary-soft);
  outline: 2px dashed var(--primary);
  outline-offset: -2px;
}

.kanban-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  box-shadow: var(--shadow-sm);
  cursor: grab;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
  user-select: none;
}

.kanban-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

.kanban-card.is-dragging {
  opacity: 0.45;
  cursor: grabbing;
}

.kanban-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-2);
}

.kanban-card-title {
  font-size: var(--font-size-sm);
  font-weight: 700;
  color: var(--text);
}

.kanban-card-job {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  margin-bottom: var(--space-3);
}

.kanban-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-2);
  border-top: 1px solid var(--border);
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

.days-in-stage-badge {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-weight: 600;
}

.days-in-stage-badge.stale {
  background: var(--danger-soft);
  color: var(--danger);
  font-weight: 700;
}

/* ---------------------------------------------------------------------
   4. Calendar Views (hr/interviews.html)
--------------------------------------------------------------------- */
.calendar-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.calendar-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.calendar-month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-collapse: collapse;
}

.calendar-day-header {
  padding: var(--space-3);
  text-align: center;
  font-size: var(--font-size-xs);
  font-weight: 700;
  color: var(--text-muted);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

.calendar-day-header:last-child {
  border-right: none;
}

.calendar-cell {
  min-height: 110px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: var(--space-2);
  background: var(--surface);
  position: relative;
  overflow: hidden;
}

.calendar-cell:nth-child(7n) {
  border-right: none;
}

.calendar-cell.other-month {
  background: var(--surface-2);
  opacity: 0.5;
}

.calendar-cell.is-today {
  background: var(--primary-soft);
}

.calendar-cell-date {
  font-size: var(--font-size-xs);
  font-weight: 700;
  margin-bottom: 4px;
}

.calendar-event-chip {
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  color: var(--primary);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  display: block;
}

.calendar-event-chip.scheduled { background: var(--primary-soft); color: var(--primary); }
.calendar-event-chip.completed { background: var(--success-soft); color: var(--success-text); }
.calendar-event-chip.cancelled { background: var(--danger-soft); color: var(--danger-text); }
.calendar-event-chip.rescheduled { background: var(--warning-soft); color: var(--warning-text); }

/* ---------------------------------------------------------------------
   5. Analytics Charts Layout (hr/analytics.html)
--------------------------------------------------------------------- */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-6);
  margin-top: var(--space-6);
}

@media (min-width: 1024px) {
  .charts-grid-2col {
    grid-template-columns: repeat(2, 1fr);
  }
}

.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-sm);
}

.chart-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}

.chart-canvas-container {
  width: 100%;
  height: 280px;
  position: relative;
}

/* Profile Completion Ring */
.completion-ring-container {
  position: relative;
  width: 90px;
  height: 90px;
}

.completion-ring-container svg {
  transform: rotate(-90deg);
}

.completion-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-size-md);
  font-weight: 800;
  font-family: var(--font-heading);
  color: var(--primary);
}

/* ---------------------------------------------------------------------
   6. Error Pages (403.html, 404.html)
--------------------------------------------------------------------- */
.error-page-container {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-8);
}

.error-code {
  font-size: 6rem;
  font-family: var(--font-heading);
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
  margin-bottom: var(--space-2);
}

/* =====================================================================
   HireFlow Print Stylesheet (print.css)
   Optimized for clean A4 Offer Letter generation & document printouts
===================================================================== */

@media print {
  /* Hide UI chrome, navigation, buttons and banners */
  .demo-banner,
  .navbar-public,
  .app-sidebar,
  .app-topbar,
  .sidebar-backdrop,
  .btn,
  .page-actions,
  .tabs,
  .toast-container,
  .modal-backdrop,
  .drawer-backdrop,
  .drawer,
  .skip-link,
  .no-print {
    display: none !important;
  }

  /* Reset layout for print */
  body, html {
    background: #ffffff !important;
    color: #000000 !important;
    font-size: 12pt !important;
    line-height: 1.5 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .app-layout, .app-main, .app-content {
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
  }

  /* Page setup: A4 with standard 20mm margins */
  @page {
    size: A4;
    margin: 20mm;
  }

  /* Offer Letter document styling */
  .printable-offer-container {
    padding: 0 !important;
    border: none !important;
    box-shadow: none !important;
    background: transparent !important;
    color: #111827 !important;
  }

  .print-letterhead {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #1f2937;
    padding-bottom: 12pt;
    margin-bottom: 24pt;
  }

  .print-letterhead h1 {
    font-size: 20pt !important;
    color: #111827 !important;
    margin: 0 !important;
  }

  .print-signature-section {
    margin-top: 48pt;
    display: flex !important;
    justify-content: space-between;
    page-break-inside: avoid;
  }

  .signature-block {
    width: 45%;
    border-top: 1px solid #9ca3af;
    padding-top: 6pt;
    font-size: 10pt;
    color: #4b5563;
  }

  a[href]::after {
    content: "" !important; /* Don't display link destinations in print */
  }
}

  </style>

                <input type="tel" id="prof-phone" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="prof-location">Location (City, State / Remote)</label>

              <div class="form-group">
                <label class="form-label" for="prof-headline">Professional Headline</label>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" style="font-size: var(--font-size-sm); line-height: 1.6;">
        <p>HireFlow enforces strict forward workflow integrity and auditability:</p>
        <ul style="padding-left: var(--space-4); margin-bottom: var(--space-4); display: flex; flex-direction: column; gap: 8px;">

          <li><strong>Screening → Interview</strong>, <strong>Rejected</strong>, or <strong>Applied</strong> (revert)</li>

          <li><strong>Selected → Offered</strong>, <strong>Rejected</strong>, or <strong>Interview</strong> (revert)</li>
          <li><strong>Offered → Rejected</strong> (only if offer declined or withdrawn)</li>
        </ul>
        <div style="background: var(--surface-2); padding: var(--space-3); border-radius: var(--radius-md);">
          <strong>Validation Guards:</strong>
          <ul style="padding-left: var(--space-4); margin-top: 4px; font-size: var(--font-size-xs);">
            <li>Moving to <em>Interview</em> requires at least one scheduled interview session.</li>
            <li>Moving to <em>Offered</em> requires a draft or issued offer letter.</li>
            <li>Rejected and Withdrawn stages are terminal.</li>
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary btn-sm" data-close-modal>Understood</button>
      </div>
    </div>
  </div>

          <button type="submit" class="btn btn-primary" id="btn-save-sched">Confirm & Schedule</button>
        </div>

    </div>
  </div>

  <script>

  views: Object.create(null),
  titles: Object.create(null),
  location: { pathname: '/index.html', search: '', hash: '', href: '/index.html' },
  _rendering: false,
  _pending: false,
  onReady(route, fn) {
    this.handlers[route] = fn;
  },
  resolve(target) {
    target = String(target == null ? '' : target).trim();
    if (/^(https?:|mailto:|blob:|data:)/i.test(target)) return { external: target };
    let inPage = '';
    const hashIdx = target.indexOf('#');
    if (hashIdx >= 0) {
      inPage = target.slice(hashIdx);
      target = target.slice(0, hashIdx);
    }
    let search = '';
    const qIdx = target.indexOf('?');
    if (qIdx >= 0) {
      search = target.slice(qIdx);
      target = target.slice(0, qIdx);
    }
    let pathname;
    if (!target) pathname = this.location.pathname;
    else if (target.startsWith('/')) pathname = target;
    else {

      const stack = [];

      const h = after.indexOf('#');

      return;
    }
    const id = h.slice(1);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView();
    else window.scrollTo(0, 0);
  },
  render() {
    if (this._rendering) {
      this._pending = true;
      return;
    }
    this._rendering = true;
    try {
      const pathAtStart = this.location.pathname;
      document.querySelectorAll('.sidebar-backdrop, .drawer-backdrop, .modal-backdrop').forEach((el) => el.remove());
      document.body.style.overflow = '';
      const known = Object.prototype.hasOwnProperty.call(this.views, pathAtStart);
      const viewPath = known ? pathAtStart : '/404.html';
      const app = document.getElementById('app');
      app.innerHTML = this.views[viewPath] || '';
      document.title = known ? (this.titles[pathAtStart] || 'HireFlow') : (this.titles['/404.html'] || 'Page Not Found');
      const handler = this.handlers[viewPath];
      if (handler) handler();
      if (this.location.pathname !== pathAtStart) return;
      this.scrollToHash();
    } finally {
      this._rendering = false;
      if (this._pending) {
        this._pending = false;
        this.render();
      }
    }
  },
  start() {
    document.querySelectorAll('template[data-route]').forEach((node) => {
      const route = node.getAttribute('data-route');
      this.views[route] = node.innerHTML;
      this.titles[route] = node.getAttribute('data-title') || 'HireFlow';
    });
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      if (a.target && a.target !== '_self') return;
      if (a.hasAttribute('download')) return;
      const href = a.getAttribute('href');
      if (!href || /^(https?:|mailto:|blob:|data:|javascript:)/i.test(href)) return;
      e.preventDefault();
      HF.go(href);
    });
    document.addEventListener('submit', (e) => {
      const form = e.target;
      if (form && form.tagName === 'FORM' && !form.getAttribute('action')) {
        e.preventDefault();
      }
    }, true);
    window.addEventListener('popstate', () => {
      HF.location = HF.parseHash();
      HF.render();
    });
    if (!location.hash.startsWith('#/')) {
      history.replaceState({ hf: 1 }, '', '#/index.html');
    }
    HF.location = HF.parseHash();
    HF.render();
  }
};

/**
 * HireFlow Storage Utility
 * Safe, robust localStorage wrapper with error recovery and quota detection.
 */

const storage = {
  /**
   * Read and parse JSON from localStorage
   * @param {string} key 
   * @param {any} defaultValue 
   * @returns {any}
   */
  get(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(key);
      if (item === null) return defaultValue;
      return JSON.parse(item);
    } catch (err) {
      console.error(`[HireFlow Storage] Error reading key "${key}":`, err);
      return defaultValue;
    }
  },

  /**
   * Serialize and store value in localStorage
   * @param {string} key 
   * @param {any} value 
   * @returns {boolean} Success status
   */
  set(key, value) {
    try {
      const serialized = JSON.stringify(value);
      localStorage.setItem(key, serialized);
      return true;
    } catch (err) {
      if (
        err.name === 'QuotaExceededError' ||
        err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
        err.code === 22 ||
        err.code === 1014
      ) {
        console.error('[HireFlow Storage] LocalStorage quota exceeded!', err);
        alert('Browser storage quota exceeded. Please reset demo data in Settings.');
      } else {
        console.error(`[HireFlow Storage] Error writing key "${key}":`, err);
      }
      return false;
    }
  },

  /**
   * Remove a key
   * @param {string} key 
   */
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (err) {
      console.error(`[HireFlow Storage] Error removing key "${key}":`, err);
    }
  },

  /**
   * Clear all app storage
   */
  clear() {
    try {
      localStorage.clear();
    } catch (err) {
      console.error('[HireFlow Storage] Error clearing localStorage:', err);
    }
  }
};

/* js/lib/escape.js */
/**
 * HireFlow Security Utilities - HTML Escaping & Sanitization
 * Strictly prevents XSS and CSV formula injection
 */

/**
 * Escapes unsafe HTML characters in a string
 * @param {string|number|null|undefined} str 
 * @returns {string} Safe escaped string
 */
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Sanitizes attributes to prevent breaking out of attribute quotes
 * @param {string} str 
 * @returns {string}
 */
function sanitizeAttr(str) {
  return escapeHTML(str);
}

/**
 * Tagged template literal for safe HTML rendering.
 * All interpolated variables are escaped automatically unless flagged as safe.
 * Example: html`<div>${candidate.name}</div>`
 */
function html(strings, ...values) {
  return strings.reduce((result, string, i) => {
    const value = values[i - 1];
    let safeValue = '';
    
    if (value === null || value === undefined) {
      safeValue = '';
    } else if (value && value.__safeHTML === true) {
      safeValue = value.content;
    } else if (Array.isArray(value)) {
      safeValue = value.map(v => (v && v.__safeHTML ? v.content : escapeHTML(v))).join('');
    } else {
      safeValue = escapeHTML(value);
    }
    
    return result + safeValue + string;
  });
}

/**
 * Mark a string as trusted HTML that shouldn't be re-escaped by html``
 * @param {string} str 
 * @returns {Object} Safe HTML container
 */
function safeHTML(str) {
  return { __safeHTML: true, content: String(str) };
}

/**
 * Sanitizes CSV cell values to prevent CSV formula injection (OWASP guideline)
 * In spreadsheet software, cells starting with =, +, -, @, or tab are treated as formulas.
 * @param {string|number} value 
 * @returns {string} Sanitized CSV cell
 */
function sanitizeCSV(value) {
  if (value === null || value === undefined) return '""';
  let str = String(value);
  if (/^[=+\-@\t\r]/.test(str)) {
    str = "'" + str; // Prefix with single apostrophe to force text interpretation
  }
  return `"${str.replace(/"/g, '""')}"`;
}
